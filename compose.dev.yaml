# Source mounts cover application code; image-built vendor stays visible.
x-dev-php: &dev-php
  image: potsandplanters-backend-dev:${IMAGE_TAG:-local}
  build:
    target: development
  environment:
    APP_ENV: local
    APP_DEBUG: 'true'
  volumes:
    - ./backend/app:/var/www/html/app:ro
    - ./backend/config:/var/www/html/config:ro
    - ./backend/routes:/var/www/html/routes:ro
    - ./backend/resources:/var/www/html/resources:ro
    - ./backend/database:/var/www/html/database:ro
    - ./backend/bootstrap/app.php:/var/www/html/bootstrap/app.php:ro
    - ./backend/bootstrap/providers.php:/var/www/html/bootstrap/providers.php:ro
    - ./backend/tests:/var/www/html/tests:ro
    - ./backend/phpunit.xml:/var/www/html/phpunit.xml:ro

services:
  backend:
    <<: *dev-php
  horizon:
    <<: *dev-php
  scheduler:
    <<: *dev-php
  frontend:
    image: potsandplanters-frontend-dev:${IMAGE_TAG:-local}
    build:
      target: development
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: 'true'
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
      - ./frontend/next.config.ts:/app/next.config.ts:ro
      - ./frontend/tsconfig.json:/app/tsconfig.json:ro
    healthcheck:
      start_period: 90s
  nginx:
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
