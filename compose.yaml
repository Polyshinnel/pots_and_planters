x-php: &php
  image: potsandplanters-backend:${IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: docker/backend/Dockerfile
    target: runtime
  restart: "no"
  init: true
  environment: &php-env
    APP_NAME: ${APP_NAME:-Pots & Planters}
    APP_ENV: ${APP_ENV:-production}
    APP_DEBUG: 'false'
    APP_KEY: ${APP_KEY:?Set APP_KEY in .env}
    APP_URL: ${APP_URL:-http://localhost:8080}
    DB_CONNECTION: mariadb
    DB_HOST: db
    DB_PORT: 3306
    DB_DATABASE: ${DB_DATABASE:-potsandplanters}
    DB_USERNAME: ${DB_USERNAME:-potsandplanters}
    DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    REDIS_CLIENT: phpredis
    REDIS_HOST: redis
    REDIS_PORT: 6379
    REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    REDIS_DB: ${REDIS_DB:-0}
    REDIS_CACHE_DB: ${REDIS_CACHE_DB:-1}
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    SESSION_DRIVER: redis
    SESSION_CONNECTION: default
    SESSION_COOKIE: ${SESSION_COOKIE:-potsandplanters_session}
    SESSION_DOMAIN: ${SESSION_DOMAIN:-null}
    SESSION_PATH: /
    SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
    SESSION_SAME_SITE: lax
    TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}
    LOG_CHANNEL: stderr
    LOG_LEVEL: ${LOG_LEVEL:-info}
    MAIL_MAILER: log
  volumes:
    - laravel_storage:/var/www/html/storage/app
  networks: [app, data]
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  stop_grace_period: 90s

services:
  frontend:
    image: potsandplanters-frontend:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: runtime
    restart: "no"
    init: true
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://nginx/api}
    networks: [app]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  nginx:
    image: potsandplanters-nginx:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: nginx
    restart: "no"
    ports:
      - '${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80'
    volumes:
      - laravel_storage:/var/www/html/storage/app:ro
    networks: [app]
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/api/health]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5

  backend:
    <<: *php
    healthcheck:
      test: [CMD, app-healthcheck]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 5

  horizon:
    <<: *php
    command: [php, artisan, horizon]
    healthcheck:
      test: [CMD, php, artisan, horizon:status]
      interval: 20s
      timeout: 10s
      start_period: 30s
      retries: 5

  scheduler:
    <<: *php
    command: [php, artisan, schedule:work]
    deploy:
      replicas: 1
    healthcheck:
      test: [CMD, php, artisan, infrastructure:scheduler-status, --quiet]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3

  db:
    image: mariadb:11.8
    restart: "no"
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-potsandplanters}
      MARIADB_USER: ${DB_USERNAME:-potsandplanters}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks: [data]
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10

  redis:
    image: redis:8.2-alpine
    restart: "no"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: [redis-server, --appendonly, 'yes', --requirepass, '${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}']
    volumes:
      - redis_data:/data
    networks: [data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  app:
  data:
    internal: true

volumes:
  mariadb_data:
  redis_data:
  laravel_storage:
