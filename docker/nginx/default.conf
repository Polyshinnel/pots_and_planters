# Docker DNS refresh keeps upstream addresses current after service recreation.
resolver 127.0.0.11 valid=10s ipv6=off;
upstream php_backend {
    zone php_backend 64k;
    server backend:9000 resolve;
}
upstream next_frontend {
    zone next_frontend 64k;
    server frontend:3000 resolve;
}
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
# The direct host port is loopback-only. Dokploy's router must overwrite these headers.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https https;
    http http;
}
map $http_host $host_port {
    default $server_port;
    ~:(?<port_from_host>[0-9]+)$ $port_from_host;
}
map $forwarded_proto $origin_port {
    default $host_port;
    https 443;
}
map $http_x_forwarded_port $forwarded_port {
    default $origin_port;
    ~^\d+$ $http_x_forwarded_port;
}

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    server_tokens off;
    client_max_body_size 220m;

    location ~ ^/(css|js|fonts)/filament/ {
        try_files $uri =404;
    }

    location /storage/ {
        alias /var/www/html/storage/app/public/;
        autoindex off;
        location ~ \.php$ { return 404; }
    }

    # Filament 5 / Livewire 4 includes a hash in its default route prefix.
    location ~ ^/(api|admin|horizon|filament|livewire[^/]*)(/|$) {
        try_files $uri /index.php?$query_string;
    }

    location = /up {
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        internal;
        include fastcgi_params;
        fastcgi_pass php_backend;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_host;
        fastcgi_param HTTP_X_FORWARDED_PROTO $forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_PORT $forwarded_port;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        # Use the nginx peer address as the immediate trusted proxy hop.
        fastcgi_param REMOTE_ADDR $server_addr;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\. { deny all; }
    location ~ \.php$ { return 404; }

    location / {
        proxy_pass http://next_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
